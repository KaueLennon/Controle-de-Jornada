<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Jornada</title>
  <link rel="icon" type="image/png" href="clock.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: linear-gradient(45deg, cyan, #2869EB);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tela-hora {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 50px 60px;
      border-radius: 15px;
      color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      width: 340px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 5px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #fff;
      color: #000;
      font-size: 15px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #00bfff;
      box-shadow: 0 0 5px #00bfff;
    }

    button {
      background-color: dodgerblue;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      margin-top: 25px;
      transition: 0.3s;
    }

    button:hover {
      background-color: deepskyblue;
      cursor: pointer;
      transform: scale(1.03);
    }

    .result {
      margin-top: 25px;
      border-radius: 10px;
      padding: 5px;
      text-align: left;
      font-size: 14px;
    }

    .result p {
      margin: 6px 0;
    }

    .error {
      color: #ff4444;
      font-weight: bold;
      text-align: center;
    }

    .info-circle {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 50%;
      background-color: white;
      color: black;
      font-weight: bold;
      font-size: 12px;
      cursor: help;
    }
  </style>
</head>
<body>
  <div class="tela-hora">
    <h1>Controle Jornada</h1>

    <label>Colar horários (opcional)</label>
    <input type="text" id="colagem" placeholder="Ex: 07:53  11:21  13:10">

    <label>Horário de Entrada</label>
    <input type="time" id="entrada">

    <label>Início do Almoço</label>
    <input type="time" id="almocoInicio">

    <label>Fim do Almoço</label>
    <input type="time" id="almocoFim">

    <button onclick="calcular()">Calcular</button>

    <div class="result" id="resultado"></div>
  </div>

  <script>
    function Converter_Para_Minutos(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function Converter_Para_Hora(minutes) {
      const h = Math.floor(Math.abs(minutes) / 60).toString().padStart(2, "0");
      const m = Math.abs(minutes) % 60;
      return `${h}:${m.toString().padStart(2, "0")}`;
    }

    // 🔥 Função reutilizável para preencher campos
    function preencherCampos(texto) {
      const partes = texto.split(/[\s,]+/);

      if (partes.length >= 3) {
        document.getElementById("entrada").value = partes[0];
        document.getElementById("almocoInicio").value = partes[1];
        document.getElementById("almocoFim").value = partes[2];
      }
    }

    // Colar no campo específico
    document.getElementById("colagem").addEventListener("paste", function(e) {
      setTimeout(() => preencherCampos(e.target.value), 10);
    });

    // 🔥 Colar em qualquer input
    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("paste", function(e) {
        const texto = (e.clipboardData || window.clipboardData).getData("text");

        // Se detectar múltiplos horários
        if (texto.match(/\d{2}:\d{2}.*\d{2}:\d{2}/)) {
          e.preventDefault();
          preencherCampos(texto);
        }
      });
    });

    function calcular() {
      const entrada = document.getElementById("entrada").value;
      const almocoInicio = document.getElementById("almocoInicio").value;
      const almocoFim = document.getElementById("almocoFim").value;
      const resultado = document.getElementById("resultado");

      if (!entrada || !almocoInicio || !almocoFim) {
        resultado.innerHTML = "<p class='error'>Preencha todos os campos!</p>";
        return;
      }

      const entradaMin = Converter_Para_Minutos(entrada);
      const almocoInicioMin = Converter_Para_Minutos(almocoInicio);
      const almocoFimMin = Converter_Para_Minutos(almocoFim);

      const intervaloReal = almocoFimMin - almocoInicioMin;

      let heIntervalo = 0;
      if (intervaloReal < 60) {
        heIntervalo = 60 - intervaloReal;
      }

      const saidaPlanejada = 588 - (60 - intervaloReal) + entradaMin;
      const saidaLimite = saidaPlanejada + 72;

      const agora = new Date();
      const agoraMin = agora.getHours() * 60 + agora.getMinutes();
      let tempoSaida = saidaPlanejada - agoraMin;

      const inconsistenciaInicioIntervalo = (almocoInicioMin - entradaMin < 180) ? "Sim" : "Não";
      const inconsistenciaIntervalo = (intervaloReal < 30 || intervaloReal > 180) ? "Sim" : "Não";
      const inconsistenciaFimJornada = (agoraMin > saidaLimite ? "Sim" : "Não");

      const corInicio = inconsistenciaInicioIntervalo === "Sim" ? "red" : "none";
      const corIntervalo = inconsistenciaIntervalo === "Sim" ? "red" : "none";
      const corFimJornada = inconsistenciaFimJornada === "Sim" ? "red" : "none";
      const corHoraExtraVerdadeiro = agoraMin > saidaLimite ? "red" : "none";

      if (almocoInicioMin < entradaMin || almocoFimMin < almocoInicioMin) {
        resultado.innerHTML = "<p class='error'>Horários Divergentes</p>";
        return;
      }

      resultado.innerHTML = `
        <p><b>Intervalo Real:</b> ${Converter_Para_Hora(intervaloReal)}</p>
        <p><b>HE Intervalo:</b> ${Converter_Para_Hora(heIntervalo)}</p>
        <p><b>Saída Planejada:</b> ${Converter_Para_Hora(saidaPlanejada)}</p>
        <p><b>Saída Limite:</b> ${Converter_Para_Hora(saidaLimite)}</p>
        ${tempoSaida >= 0 
        ? `<p><b>Tempo para Saída:</b> ${Converter_Para_Hora(tempoSaida)}</p>` 
        : `<p><b>Tempo em Hora Extra:</b> <span style="color:${corHoraExtraVerdadeiro}">${Converter_Para_Hora(tempoSaida)}</span></p>`}

        <hr>
        <p><b><span class="info-circle" title="O Intervalo não pode iniciar com menos de 3h de Jornada">i</span> Inconsistência de Início Intervalo: </b><span style="color:${corInicio}">${inconsistenciaInicioIntervalo}</span></p>
        <p><b><span class="info-circle" title="O Intervalo não pode ser maior que 3h">i</span> Inconsistência de Intervalo: </b><span style="color:${corIntervalo}">${inconsistenciaIntervalo}</span></p>
        <p><b><span class="info-circle" title="Hora Extra acima de 1h12">i</span> Inconsistência Fim de Jornada: </b><span style="color:${corFimJornada}">${inconsistenciaFimJornada}</span></p>
      `;
    }
  </script>
</body>
</html>
